<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Al-Qur'an - HidayahPath</title>
    
        <!-- Base URL for GitHub Pages -->
    <base href="/hudaverse/">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#10b981">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="HidayahPath">
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { 
                        sans: ['Inter', 'sans-serif'],
                        arabic: ['Scheherazade New', 'serif']
                    },
                    colors: { emerald: { 500: '#10b981', 600: '#059669' }, slate: { 100: '#f1f5f9', 800: '#1e293b', 900: '#0f172a'} },
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">
    <style>
        .font-arabic { font-family: 'Scheherazade New', serif; }
        .loading-shimmer {
            background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased">

    <main class="py-12 md:py-16 min-h-[calc(100vh-180px)]">
        <div id="quran-container" class="container mx-auto px-4 md:px-6">
            <!-- Surah List View -->
            <div id="surah-list-view">
                <div class="text-center mb-10">
                    <h1 class="text-4xl font-bold text-slate-800">Al-Qur'an Al-Karim</h1>
                    <p class="mt-2 text-lg text-slate-600">Pilih Surah untuk mulai membaca dan mendengarkan.</p>
                </div>
                
                <!-- Search Bar -->
                <div class="max-w-md mx-auto mb-8">
                    <div class="relative">
                        <input type="text" id="search-surah" placeholder="Cari surah..." 
                               class="w-full px-4 py-3 pl-10 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500">
                        <i data-lucide="search" class="absolute left-3 top-3.5 w-4 h-4 text-slate-400"></i>
                    </div>
                </div>

                <!-- Loading State -->
                <div id="loading-state" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    <!-- Loading placeholders -->
                    <div class="bg-white p-4 rounded-lg shadow-md loading-shimmer h-24"></div>
                    <div class="bg-white p-4 rounded-lg shadow-md loading-shimmer h-24"></div>
                    <div class="bg-white p-4 rounded-lg shadow-md loading-shimmer h-24"></div>
                    <div class="bg-white p-4 rounded-lg shadow-md loading-shimmer h-24"></div>
                    <div class="bg-white p-4 rounded-lg shadow-md loading-shimmer h-24"></div>
                    <div class="bg-white p-4 rounded-lg shadow-md loading-shimmer h-24"></div>
                </div>

                <!-- Surah Grid -->
                <div id="surah-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 hidden">
                </div>
            </div>

            <!-- Surah Reader View -->
            <div id="surah-reader-view" class="hidden"></div>
        </div>
    </main>

    <div class="h-28"></div>
    <!-- <footer class="bg-slate-900 text-slate-400 py-8 text-center"><p>&copy; 2025 HidayahPath. All Rights Reserved.</p></footer> -->
    <nav class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-white/80 backdrop-blur-sm shadow-xl rounded-full transition-all duration-300 z-50">
        <div class="flex justify-around items-center h-16 px-4 py-2 gap-2 md:gap-4">
            <a href="beranda.html" data-page="index" class="nav-link group relative flex flex-col items-center justify-center text-slate-500 hover:text-emerald-500 transition-colors p-2"><i data-lucide="home" class="w-5 h-5"></i><span class="text-xs mt-1 opacity-70 group-hover:opacity-100">Beranda</span></a>
            <a href="fahmi.html" data-page="fahmi" class="nav-link group relative flex flex-col items-center justify-center text-slate-500 hover:text-emerald-500 transition-colors p-2"><i data-lucide="graduation-cap" class="w-5 h-5"></i><span class="text-xs mt-1 opacity-70 group-hover:opacity-100">Fahmi</span></a>
            <a href="alquran.html" data-page="alquran" class="nav-link group relative -translate-y-3 flex items-center justify-center bg-emerald-500 text-white rounded-full w-16 h-16 shadow-lg hover:bg-emerald-600 transition-all"><i data-lucide="book-open" class="w-8 h-8"></i></a>
            <a href="hasanah.html" data-page="hasanah" class="nav-link group relative flex flex-col items-center justify-center text-slate-500 hover:text-emerald-500 transition-colors p-2"><i data-lucide="coins" class="w-5 h-5"></i><span class="text-xs mt-1 opacity-70 group-hover:opacity-100">Hasanah</span></a>
            <a href="studio.html" data-page="studio" class="nav-link group relative flex flex-col items-center justify-center text-slate-500 hover:text-emerald-500 transition-colors p-2"><i data-lucide="target" class="w-5 h-5"></i><span class="text-xs mt-1 opacity-70 group-hover:opacity-100">Streak</span></a>
        </div>
    </nav>
    
    <!-- Load QuranDataManager -->
    <script src="js/quran-data.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // Initialize elements
            const surahListView = document.getElementById('surah-list-view');
            const surahReaderView = document.getElementById('surah-reader-view');
            const surahGrid = document.getElementById('surah-grid');
            const loadingState = document.getElementById('loading-state');
            const searchInput = document.getElementById('search-surah');

            // Initialize data manager
            const quranManager = new QuranDataManager();
            await quranManager.init();

            // Audio player
            const audioPlayer = new Audio();
            let currentPlayingSurah = null;

            // Show surah list
            function renderSurahList(filteredList = null) {
                const surahList = filteredList || quranManager.getSurahList();
                
                surahGrid.innerHTML = '';
                surahList.forEach(surah => {
                    const tempat = surah.tempat_turun === 'mekah' ? 'Makkiyyah' : 'Madaniyyah';
                    surahGrid.innerHTML += `
                        <div class="bg-white p-4 rounded-lg shadow-md flex items-center justify-between hover:shadow-xl hover:border-emerald-500 border-2 border-transparent transition-all cursor-pointer group" data-surah-nomor="${surah.nomor}">
                            <div class="flex items-center">
                                <span class="flex items-center justify-center w-10 h-10 mr-4 text-emerald-600 bg-emerald-100 rounded-md font-bold">${surah.nomor}</span>
                                <div>
                                    <h3 class="font-bold text-slate-800 group-hover:text-emerald-600 transition-colors">${surah.nama_latin}</h3>
                                    <p class="text-sm text-slate-500">${surah.arti} • ${surah.jumlah_ayat} Ayat • ${tempat}</p>
                                </div>
                            </div>
                            <div class="text-2xl font-arabic text-slate-700">${surah.nama}</div>
                        </div>`;
                });

                // Hide loading, show grid
                loadingState.classList.add('hidden');
                surahGrid.classList.remove('hidden');
            }

            // Search functionality
            searchInput.addEventListener('input', (e) => {
                const query = e.target.value.toLowerCase();
                if (query === '') {
                    renderSurahList();
                    return;
                }

                const filtered = quranManager.getSurahList().filter(surah => 
                    surah.nama_latin.toLowerCase().includes(query) ||
                    surah.nama.includes(query) ||
                    surah.arti.toLowerCase().includes(query) ||
                    surah.nomor.toString().includes(query)
                );
                renderSurahList(filtered);
            });

            // Render surah reader
            async function renderSurahReader(nomorSurah) {
                const surahInfo = quranManager.getSurahList().find(s => s.nomor == nomorSurah);
                
                // Show loading state
                surahReaderView.innerHTML = `
                    <div class="max-w-4xl mx-auto">
                        <div class="text-center mb-8 p-6 bg-white rounded-xl shadow-lg">
                            <div class="loading-shimmer h-8 w-64 mx-auto mb-4 rounded"></div>
                            <div class="loading-shimmer h-6 w-48 mx-auto rounded"></div>
                        </div>
                        <div class="bg-white rounded-xl shadow-lg p-8">
                            <div class="space-y-6">
                                <div class="loading-shimmer h-16 w-full rounded"></div>
                                <div class="loading-shimmer h-16 w-full rounded"></div>
                                <div class="loading-shimmer h-16 w-full rounded"></div>
                            </div>
                        </div>
                    </div>`;

                lucide.createIcons();

                // Load actual data
                const surahData = await quranManager.loadSurahData(nomorSurah);
                
                if (surahData.error) {
                    surahReaderView.innerHTML = `
                        <div class="max-w-4xl mx-auto text-center p-8">
                            <button id="back-to-list-btn" class="mb-4 px-4 py-2 bg-emerald-500 text-white rounded-lg hover:bg-emerald-600 transition-colors">
                                <i data-lucide="arrow-left" class="w-4 h-4 inline mr-2"></i>Kembali
                            </button>
                            <h2 class="text-2xl font-bold mb-4">${surahInfo.nama_latin}</h2>
                            <div class="bg-yellow-50 border border-yellow-200 rounded-lg p-6">
                                <i data-lucide="alert-triangle" class="w-8 h-8 text-yellow-500 mx-auto mb-4"></i>
                                <p class="text-yellow-800">Mohon maaf, data lengkap surah ini belum tersedia.</p>
                                <p class="text-sm text-yellow-600 mt-2">Audio tetap dapat diputar.</p>
                            </div>
                        </div>`;
                    lucide.createIcons();
                    return;
                }

                // Generate ayat HTML with tafsir
                let ayatHtml = surahData.ayat.map(ayat => `
                    <div class="py-6 border-b border-slate-200 last:border-b-0">
                        <div class="flex justify-between items-center mb-4">
                            <span class="flex items-center justify-center w-8 h-8 text-emerald-600 bg-emerald-100 rounded-full text-sm font-bold">${ayat.nomor}</span>
                        </div>
                        <div class="text-3xl font-arabic text-right leading-loose text-slate-800 mb-4">${ayat.teks_arab}</div>
                        <div class="text-slate-700 text-lg leading-relaxed mb-3">${ayat.teks_indonesia}</div>
                        ${ayat.tafsir ? `
                            <details class="mt-4">
                                <summary class="cursor-pointer text-emerald-600 hover:text-emerald-700 font-medium">
                                    <i data-lucide="book-open" class="w-4 h-4 inline mr-1"></i>Tafsir
                                </summary>
                                <div class="mt-3 p-4 bg-slate-50 rounded-lg text-sm text-slate-600 leading-relaxed">
                                    ${ayat.tafsir}
                                </div>
                            </details>
                        ` : ''}
                    </div>
                `).join('');

                surahReaderView.innerHTML = `
                    <div class="max-w-4xl mx-auto">
                        <div class="relative text-center mb-8 p-6 bg-white rounded-xl shadow-lg">
                            <button id="back-to-list-btn" class="absolute top-5 left-5 text-slate-500 hover:text-emerald-500 transition-colors" aria-label="Kembali ke daftar surah">
                                <i data-lucide="arrow-left" class="w-6 h-6"></i>
                            </button>
                            <div class="flex justify-center items-center gap-4">
                                <h2 class="text-3xl font-bold text-emerald-600">${surahInfo.nama_latin}</h2>
                                <button id="audio-player-btn" data-surah-nomor="${nomorSurah}" class="w-12 h-12 flex items-center justify-center rounded-full bg-emerald-100 text-emerald-600 hover:bg-emerald-200 transition-all">
                                    <i data-lucide="play" class="w-6 h-6"></i>
                                </button>
                            </div>
                            <p class="text-4xl font-arabic mt-2 text-slate-800">${surahInfo.nama}</p>
                            <p class="text-slate-500 mt-2">${surahInfo.arti} • ${surahInfo.jumlah_ayat} Ayat</p>
                        </div>
                        ${nomorSurah != 9 && nomorSurah != 1 ? `
                            <div class="text-center py-6 font-arabic text-3xl text-slate-800">
                                بِسْمِ اللّٰهِ الرَّحْمٰنِ الرَّحِيْمِ
                            </div>
                        ` : ''}
                        <div class="bg-white rounded-xl shadow-lg p-4 md:p-8">${ayatHtml}</div>
                    </div>`;
                
                lucide.createIcons();
            }

            // Navigation functions
            function switchToReaderView(nomorSurah) {
                surahListView.classList.add('hidden');
                surahReaderView.classList.remove('hidden');
                renderSurahReader(nomorSurah);
                window.scrollTo(0, 0);
            }

            function switchToListView() {
                if (!audioPlayer.paused) {
                    audioPlayer.pause();
                }
                audioPlayer.src = '';
                currentPlayingSurah = null;

                surahReaderView.innerHTML = '';
                surahReaderView.classList.add('hidden');
                surahListView.classList.remove('hidden');
            }

            // Audio player functionality
            function handleAudioPlay(button, nomorSurah) {
                const icon = button.querySelector('i');

                if (currentPlayingSurah === nomorSurah && !audioPlayer.paused) {
                    audioPlayer.pause();
                } else {
                    const audioUrl = `https://server7.mp3quran.net/s_gmd/${nomorSurah.toString().padStart(3, '0')}.mp3`;
                    audioPlayer.src = audioUrl;
                    audioPlayer.play();
                    currentPlayingSurah = nomorSurah;
                }
            }

            // Audio event listeners
            audioPlayer.addEventListener('play', () => {
                const btn = document.getElementById('audio-player-btn');
                if (btn && btn.dataset.surahNomor == currentPlayingSurah) {
                    btn.innerHTML = `<i data-lucide="pause" class="w-6 h-6"></i>`;
                    lucide.createIcons();
                }
            });

            audioPlayer.addEventListener('pause', () => {
                const btn = document.getElementById('audio-player-btn');
                if (btn && btn.dataset.surahNomor == currentPlayingSurah) {
                    btn.innerHTML = `<i data-lucide="play" class="w-6 h-6"></i>`;
                    lucide.createIcons();
                }
            });

            audioPlayer.addEventListener('ended', () => {
                const btn = document.getElementById('audio-player-btn');
                if (btn && btn.dataset.surahNomor == currentPlayingSurah) {
                    btn.innerHTML = `<i data-lucide="play" class="w-6 h-6"></i>`;
                    lucide.createIcons();
                    currentPlayingSurah = null;
                }
            });

            audioPlayer.addEventListener('waiting', () => {
                const btn = document.getElementById('audio-player-btn');
                if (btn && btn.dataset.surahNomor == currentPlayingSurah) {
                    btn.innerHTML = `<i data-lucide="loader-circle" class="w-6 h-6 animate-spin"></i>`;
                    lucide.createIcons();
                }
            });

            // Event listeners
            surahGrid.addEventListener('click', e => {
                const card = e.target.closest('[data-surah-nomor]');
                if (card) switchToReaderView(card.dataset.surahNomor);
            });

            surahReaderView.addEventListener('click', e => {
                const backBtn = e.target.closest('#back-to-list-btn');
                const audioBtn = e.target.closest('#audio-player-btn');
                if (backBtn) switchToListView();
                if (audioBtn) handleAudioPlay(audioBtn, audioBtn.dataset.surahNomor);
            });

            // Initialize
            lucide.createIcons();
            renderSurahList();
        });
    </script>
</body>
</html>
