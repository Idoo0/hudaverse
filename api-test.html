<!DOCTYPE html>
<html>
<head>
    <title>API Key Test</title>
</head>
<body>
    <h1>API Key Test</h1>
    <button onclick="testApiKey()">Test API Key</button>
    <div id="result"></div>

    <script>
        async function testApiKey() {
            const resultDiv = document.getElementById('result');
            const apiKey = "AIzaSyAxGvhjqziXocgMKLyqanpyxdIcMMnSWdY";
            
            resultDiv.innerHTML = '<p>Testing API key...</p>';
            
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{
                                text: "Hello, just testing API connection. Please respond with 'API works!'"
                            }]
                        }]
                    })
                });
                
                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`HTTP ${response.status}: ${errorText}`);
                }
                
                const data = await response.json();
                console.log('API Response:', data);
                
                if (data.candidates && data.candidates[0]) {
                    resultDiv.innerHTML = `
                        <p>✅ API Key Works!</p>
                        <p>Response: ${data.candidates[0].content.parts[0].text}</p>
                    `;
                } else {
                    resultDiv.innerHTML = '<p>❌ No response content</p>';
                }
                
            } catch (error) {
                console.error('API Error:', error);
                resultDiv.innerHTML = `<p>❌ API Error: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
