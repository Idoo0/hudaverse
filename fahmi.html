<!DOCTYPE html>
<html lang="id">
<head>
    <!-- Base URL for GitHub Pages -->
    <base href="/hudaverse/">
    
    <!-- PWA Configuration -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="HidayahPath">
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fahmi (AI Mufti) - HidayahPath</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="js/ai-service-manager.js"></script>
    <script src="js/fahmi-chatbot.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { emerald: { 500: '#10b981', 600: '#059669' }, slate: { 100: '#f1f5f9', 800: '#1e293b' } },
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&family=Scheherazade+New:wght@700&display=swap" rel="stylesheet">
    <style>
        /* Improved chat message formatting */
        #chat-window h2, #chat-window h3, #chat-window h4 {
            margin-top: 1rem;
            margin-bottom: 0.5rem;
            line-height: 1.3;
        }
        #chat-window strong {
            font-weight: 700;
            color: #1e293b;
        }
        #chat-window em {
            font-style: italic;
            color: #475569;
        }
        #chat-window code {
            font-family: 'Courier New', monospace;
            background-color: #f3f4f6;
            padding: 0.125rem 0.25rem;
            border-radius: 0.25rem;
            font-size: 0.875rem;
            border: 1px solid #e5e7eb;
        }
        #chat-window p {
            line-height: 1.6;
            margin-bottom: 0.75rem;
        }
        /* List styling improvements */
        #chat-window .ml-4 {
            margin-left: 1rem;
            margin-bottom: 0.25rem;
            line-height: 1.5;
        }
        /* Better spacing for chat bubbles */
        .max-w-md {
            max-width: 28rem;
        }
        /* Improved chat window layout */
        #chat-window {
            padding: 1rem;
        }
        /* Better scrollbar */
        #chat-window::-webkit-scrollbar {
            width: 6px;
        }
        #chat-window::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        #chat-window::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
        #chat-window::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        /* Typing indicator animation */
        .typing-indicator {
            animation: blink 1s infinite;
            color: #10b981;
            font-weight: bold;
            margin-left: 2px;
        }
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased">

    <main class="py-12 md:py-16 flex flex-col items-center justify-center min-h-[calc(100vh-180px)]">
        <div class="w-full max-w-2xl mx-auto p-4">
            <div class="bg-white rounded-2xl shadow-xl flex flex-col h-[80vh] md:h-[75vh]">
                <div class="p-4 border-b text-center">
                    <h1 class="text-xl font-bold">Fahmi (AI Mufti)</h1>
                    <p class="text-sm text-slate-500">Asisten AI Anda untuk Fikih & Al-Qur'an</p>
                </div>
                <div id="chat-window" class="flex-1 p-6 space-y-6 overflow-y-auto">
                    <div class="flex items-start gap-3 justify-start">
                        <div class="p-2 bg-emerald-500 text-white rounded-full flex-shrink-0"><i data-lucide="sparkles" class="w-5 h-5"></i></div>
                        <div class="bg-slate-100 p-3 rounded-lg max-w-md">
                            <p>Assalamu'alaikum! Saya Fahmi. Silakan ajukan pertanyaan seputar Islam. Saya akan berusaha menjawab berdasarkan Al-Qur'an dan Hadits yang shahih.</p>
                        </div>
                    </div>
                </div>
                <div class="p-4 bg-slate-50 border-t">
                    <div class="flex items-center gap-2">
                        <input id="chat-input" type="text" placeholder="Ketik pertanyaan Anda..." class="w-full px-4 py-2 bg-white border rounded-full focus:ring-2 focus:ring-emerald-500 focus:outline-none transition disabled:bg-slate-100">
                        <button id="send-btn" class="bg-emerald-500 text-white rounded-full p-3 hover:bg-emerald-600 transition-colors disabled:bg-emerald-300">
                            <i data-lucide="send" class="w-5 h-5"></i>
                        </button>
                        <button id="settings-btn" class="bg-gray-500 text-white rounded-full p-3 hover:bg-gray-600 transition-colors" title="AI Settings">
                            <i data-lucide="settings" class="w-5 h-5"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>
    
    <div class="h-28"></div>
    <!-- <footer class="bg-slate-900 text-slate-400 py-8 text-center"><p>&copy; 2025 HidayahPath. All Rights Reserved.</p></footer> -->
    <nav class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-white/80 backdrop-blur-sm shadow-xl rounded-full transition-all duration-300 z-50">
        <div class="flex justify-around items-center h-16 px-4 py-2 gap-2 md:gap-4">
            <a href="index.html" data-page="index" class="nav-link group relative flex flex-col items-center justify-center text-slate-500 hover:text-emerald-500 transition-colors p-2"><i data-lucide="home" class="w-5 h-5"></i><span class="text-xs mt-1 opacity-70 group-hover:opacity-100">Beranda</span></a>
            <a href="fahmi.html" data-page="fahmi" class="nav-link group relative flex flex-col items-center justify-center text-slate-500 hover:text-emerald-500 transition-colors p-2"><i data-lucide="graduation-cap" class="w-5 h-5"></i><span class="text-xs mt-1 opacity-70 group-hover:opacity-100">Fahmi</span></a>
            <a href="alquran.html" data-page="alquran" class="nav-link group relative -translate-y-3 flex items-center justify-center bg-emerald-500 text-white rounded-full w-16 h-16 shadow-lg hover:bg-emerald-600 transition-all"><i data-lucide="book-open" class="w-8 h-8"></i></a>
            <a href="hasanah.html" data-page="hasanah" class="nav-link group relative flex flex-col items-center justify-center text-slate-500 hover:text-emerald-500 transition-colors p-2"><i data-lucide="coins" class="w-5 h-5"></i><span class="text-xs mt-1 opacity-70 group-hover:opacity-100">Hasanah</span></a>
            <a href="studio.html" data-page="studio" class="nav-link group relative flex flex-col items-center justify-center text-slate-500 hover:text-emerald-500 transition-colors p-2"><i data-lucide="mic" class="w-5 h-5"></i><span class="text-xs mt-1 opacity-70 group-hover:opacity-100">Studio</span></a>
        </div>
    </nav>
    
    <script>
        // Logika navbar aktif
        const currentPage = 'fahmi';
        document.addEventListener('DOMContentLoaded', () => {
            const activeLink = document.querySelector(`.nav-link[data-page="${currentPage}"]`);
            if (activeLink) {
                activeLink.classList.remove('text-slate-500');
                activeLink.classList.add('text-emerald-500');
            }
        });
    </script>
</body>
</html>
