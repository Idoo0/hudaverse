<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fahmi (AI Mufti) - HidayahPath</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { emerald: { 500: '#10b981', 600: '#059669' }, slate: { 100: '#f1f5f9', 800: '#1e293b' } },
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&family=Scheherazade+New:wght@700&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased">

    <main class="py-12 md:py-16 flex flex-col items-center justify-center min-h-[calc(100vh-180px)]">
        <div class="w-full max-w-2xl mx-auto p-4">
            <div class="bg-white rounded-2xl shadow-xl flex flex-col h-[80vh] md:h-[75vh]">
                <div class="p-4 border-b text-center">
                    <h1 class="text-xl font-bold">Fahmi (AI Mufti)</h1>
                    <p class="text-sm text-slate-500">Asisten AI Anda untuk Fikih & Al-Qur'an</p>
                </div>
                <div id="chat-window" class="flex-1 p-6 space-y-6 overflow-y-auto">
                    <div class="flex items-start gap-3 justify-start">
                        <div class="p-2 bg-emerald-500 text-white rounded-full flex-shrink-0"><i data-lucide="sparkles" class="w-5 h-5"></i></div>
                        <div class="bg-slate-100 p-3 rounded-lg max-w-md">
                            <p>Assalamu'alaikum! Saya Fahmi. Silakan ajukan pertanyaan seputar Islam. Saya akan berusaha menjawab berdasarkan Al-Qur'an dan Hadits yang shahih.</p>
                        </div>
                    </div>
                </div>
                <div class="p-4 bg-slate-50 border-t">
                    <div class="flex items-center gap-2">
                        <input id="chat-input" type="text" placeholder="Ketik pertanyaan Anda..." class="w-full px-4 py-2 bg-white border rounded-full focus:ring-2 focus:ring-emerald-500 focus:outline-none transition disabled:bg-slate-100">
                        <button id="send-btn" class="bg-emerald-500 text-white rounded-full p-3 hover:bg-emerald-600 transition-colors disabled:bg-emerald-300">
                            <i data-lucide="send" class="w-5 h-5"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>
    
    <div class="h-28"></div>
    <footer class="bg-slate-800 text-slate-400 py-8 text-center"><p>&copy; 2025 HidayahPath. All Rights Reserved.</p></footer>
    <nav class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-white/80 backdrop-blur-sm shadow-xl rounded-full transition-all duration-300 z-50">
        <div class="flex justify-around items-center h-16 px-4 py-2 gap-2 md:gap-4">
            <a href="beranda.html" data-page="beranda" class="nav-link group relative flex flex-col items-center justify-center text-slate-500 hover:text-emerald-500 transition-colors p-2"><i data-lucide="home" class="w-6 h-6"></i><span class="tooltip hidden absolute -top-10 bg-slate-800 text-white text-xs rounded-md px-2 py-1">Beranda</span></a>
            <a href="fahmi.html" data-page="fahmi" class="nav-link group relative flex flex-col items-center justify-center text-slate-500 hover:text-emerald-500 transition-colors p-2"><i data-lucide="message-circle-question" class="w-6 h-6"></i><span class="tooltip hidden absolute -top-10 bg-slate-800 text-white text-xs rounded-md px-2 py-1">Fahmi</span></a>
            <a href="alquran.html" data-page="alquran" class="nav-link group relative -translate-y-3 flex items-center justify-center bg-emerald-500 text-white rounded-full w-16 h-16 shadow-lg hover:bg-emerald-600 transition-all"><i data-lucide="book-open" class="w-8 h-8"></i><span class="tooltip hidden absolute -top-10 bg-slate-800 text-white text-xs rounded-md px-2 py-1">Al-Qur'an</span></a>
            <a href="hasanah.html" data-page="hasanah" class="nav-link group relative flex flex-col items-center justify-center text-slate-500 hover:text-emerald-500 transition-colors p-2"><i data-lucide="sparkles" class="w-6 h-6"></i><span class="tooltip hidden absolute -top-10 bg-slate-800 text-white text-xs rounded-md px-2 py-1">Hasanah</span></a>
            <a href="studio.html" data-page="studio" class="nav-link group relative flex flex-col items-center justify-center text-slate-500 hover:text-emerald-500 transition-colors p-2"><i data-lucide="film" class="w-6 h-6"></i><span class="tooltip hidden absolute -top-10 bg-slate-800 text-white text-xs rounded-md px-2 py-1">Studio</span></a>
        </div>
    </nav>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Inisialisasi Ikon Lucide
            lucide.createIcons();

            const chatWindow = document.getElementById('chat-window');
            const chatInput = document.getElementById('chat-input');
            const sendBtn = document.getElementById('send-btn');
            const API_URL = 'http://127.0.0.1:5000/api/chat';

            const addMessageToChat = (message, sender) => {
                const messageDiv = document.createElement('div');
                let messageBubble;

                if (sender === 'user') {
                    messageDiv.className = "flex items-start gap-3 justify-end";
                    messageBubble = `<div class="bg-emerald-500 text-white p-3 rounded-lg max-w-md"><p>${message}</p></div>
                                     <div class="p-2 bg-slate-200 text-slate-600 rounded-full flex-shrink-0"><i data-lucide="user" class="w-5 h-5"></i></div>`;
                } else { // bot
                    // Ganti markdown sederhana ke HTML
                    let formattedMessage = message.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>') // Bold
                                                 .replace(/\n/g, '<br>'); // Newlines

                    messageDiv.className = "flex items-start gap-3 justify-start";
                    messageBubble = `<div class="p-2 bg-emerald-500 text-white rounded-full flex-shrink-0"><i data-lucide="sparkles" class="w-5 h-5"></i></div>
                                     <div class="bg-slate-100 p-3 rounded-lg max-w-md">${formattedMessage}</div>`;
                }
                
                messageDiv.innerHTML = messageBubble;
                chatWindow.appendChild(messageDiv);
                lucide.createIcons();
                chatWindow.scrollTop = chatWindow.scrollHeight; // Auto scroll to bottom
            };

            const toggleLoadingState = (isLoading) => {
                chatInput.disabled = isLoading;
                sendBtn.disabled = isLoading;
                if(isLoading) {
                    sendBtn.innerHTML = `<i data-lucide="loader-circle" class="w-5 h-5 animate-spin"></i>`;
                } else {
                    sendBtn.innerHTML = `<i data-lucide="send" class="w-5 h-5"></i>`;
                }
                lucide.createIcons();
            };

            const handleSend = async () => {
                const userMessage = chatInput.value.trim();
                if (!userMessage) return;

                addMessageToChat(userMessage, 'user');
                chatInput.value = '';
                toggleLoadingState(true);

                try {
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ prompt: userMessage })
                    });
                    
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }

                    const data = await response.json();
                    addMessageToChat(data.response, 'bot');

                } catch (error) {
                    console.error("Fetch error:", error);
                    addMessageToChat("Maaf, terjadi kesalahan saat menyambungkan ke server. Silakan coba lagi nanti.", 'bot');
                } finally {
                    toggleLoadingState(false);
                    chatInput.focus();
                }
            };

            sendBtn.addEventListener('click', handleSend);
            chatInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    handleSend();
                }
            });

            // Logika navbar aktif (disalin dari file lain)
            const currentPage = 'fahmi';
            const activeLink = document.querySelector(`.nav-link[data-page="${currentPage}"]`);
            if (activeLink) {
                activeLink.classList.remove('text-slate-500');
                activeLink.classList.add('text-emerald-500');
            }
        });
    </script>
</body>
</html>
